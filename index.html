/* ==========================================================================
   SOULORA — Healing & Wellness Collective
   Theme colours are taken directly from the Soulora logo:
   cream background, forest/sage greens (lotus leaves), and brushed gold.
   ========================================================================== */

:root {
  --cream: #fcf9f2;
  --cream-2: #f5efe1;
  --cream-3: #ede4cf;
  --forest: #2b3f1d;
  --green: #4a6630;
  --green-2: #6b8547;
  --sage: #a3b884;
  --sage-light: #e4ebd6;
  --gold: #c39a45;
  --gold-2: #d9b765;
  --gold-light: #efdcae;
  --ink: #26321d;
  --muted: #6c7461;
  --line: rgba(195, 154, 69, 0.35);
  --white: #fffdf8;
  --danger: #a5462f;

  --font-display: "Marcellus", "Cormorant Garamond", Georgia, serif;
  --font-serif: "Cormorant Garamond", Georgia, serif;
  --font-body: "Jost", "Segoe UI", system-ui, sans-serif;

  --radius: 18px;
  --radius-sm: 10px;
  --shadow: 0 10px 30px -12px rgba(43, 63, 29, 0.22);
  --shadow-lg: 0 24px 60px -20px rgba(43, 63, 29, 0.35);
  --gold-grad: linear-gradient(135deg, #b8893a 0%, #e3c374 45%, #c39a45 70%, #9c7430 100%);
  --max: 1180px;
}

*,
*::before,
*::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.65;
  color: var(--ink);
  background: var(--cream);
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; display: block; }
a { color: var(--green); text-decoration: none; }
a:hover { color: var(--gold); }
button { font: inherit; cursor: pointer; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 400; color: var(--forest); line-height: 1.2; margin: 0 0 .5em; }
h1 { font-size: clamp(2.4rem, 5vw, 3.9rem); letter-spacing: .02em; }
h2 { font-size: clamp(1.9rem, 3.4vw, 2.7rem); }
h3 { font-size: 1.4rem; }
p { margin: 0 0 1em; }

.container { width: min(var(--max), 92%); margin-inline: auto; }

.eyebrow {
  font-family: var(--font-body);
  text-transform: uppercase;
  letter-spacing: .28em;
  font-size: .78rem;
  font-weight: 500;
  color: var(--gold);
  display: inline-flex;
  align-items: center;
  gap: .8em;
  margin-bottom: 1rem;
}
.eyebrow::before, .eyebrow::after { content: ""; width: 28px; height: 1px; background: var(--gold); opacity: .7; }

.serif-italic { font-family: var(--font-serif); font-style: italic; }

/* Gold leaf divider (echoes the small lotus under the logo wordmark) */
.divider {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin: 1.2rem auto 1.6rem; max-width: 420px;
}
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
.divider::after { background: linear-gradient(90deg, var(--gold), transparent); }
.divider svg { width: 30px; height: 22px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .55em;
  padding: .85em 1.7em;
  border-radius: 999px;
  border: 1px solid transparent;
  font-family: var(--font-body);
  font-size: .82rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  font-weight: 500;
  transition: transform .2s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--forest); color: var(--cream); }
.btn-primary:hover { background: var(--green); color: var(--white); box-shadow: var(--shadow); }
.btn-gold { background: var(--gold-grad); color: var(--white); text-shadow: 0 1px 1px rgba(0,0,0,.15); }
.btn-gold:hover { color: var(--white); box-shadow: 0 10px 24px -10px rgba(195,154,69,.8); }
.btn-ghost { background: transparent; color: var(--forest); border-color: var(--gold); }
.btn-ghost:hover { background: var(--cream-2); color: var(--forest); }
.btn-sm { padding: .6em 1.15em; font-size: .72rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(252, 249, 242, .92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.nav { display: flex; align-items: center; justify-content: space-between; height: 78px; gap: 1rem; }
.brand { display: flex; align-items: center; gap: .7rem; color: var(--forest); }
.brand img { width: 52px; height: auto; mix-blend-mode: multiply; }
.brand-text { display: flex; flex-direction: column; line-height: 1; }
.brand-name { font-family: var(--font-display); font-size: 1.6rem; letter-spacing: .08em; color: var(--forest); }
.brand-sub { font-size: .55rem; letter-spacing: .26em; text-transform: uppercase; color: var(--green-2); margin-top: 4px; }

.nav-links { display: flex; align-items: center; gap: .3rem; list-style: none; margin: 0; padding: 0; }
.nav-links > li { position: relative; }
.nav-links a, .nav-links .nav-trigger {
  display: block; padding: .55rem .85rem;
  font-size: .78rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--forest); background: none; border: 0; border-radius: 999px;
}
.nav-links a:hover, .nav-links .nav-trigger:hover, .nav-links a.active { color: var(--gold); }
.nav-links a.active { background: var(--cream-2); }
.nav-trigger::after { content: " ▾"; font-size: .7em; }

.submenu {
  position: absolute; top: calc(100% + 8px); left: 50%; transform: translate(-50%, 6px);
  min-width: 250px; list-style: none; margin: 0; padding: .6rem;
  background: var(--white); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg);
  opacity: 0; visibility: hidden; transition: all .2s ease;
}
.has-sub:hover .submenu, .has-sub:focus-within .submenu, .has-sub.open .submenu { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
.submenu a { text-transform: none; letter-spacing: .02em; font-size: .98rem; border-radius: 10px; padding: .6rem .8rem; }
.submenu a small { display: block; color: var(--muted); font-size: .78rem; }
.submenu a:hover { background: var(--cream-2); color: var(--forest); }

.nav-cta { display: flex; align-items: center; gap: .6rem; }
.menu-toggle { display: none; background: none; border: 1px solid var(--line); border-radius: 10px; width: 44px; height: 44px; color: var(--forest); }
.menu-toggle span { display: block; width: 20px; height: 1.5px; background: currentColor; margin: 5px auto; transition: .2s; }

/* ---------- Hero ---------- */
.hero {
  position: relative; overflow: hidden;
  padding: clamp(3rem, 7vw, 6rem) 0 clamp(3rem, 6vw, 5rem);
  background:
    radial-gradient(circle at 78% 30%, rgba(239, 220, 174, .55), transparent 45%),
    radial-gradient(circle at 10% 90%, rgba(163, 184, 132, .25), transparent 40%),
    var(--cream);
}
.hero-grid { display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: 3rem; }
.hero h1 span { display: block; }
.hero .tagline { font-family: var(--font-serif); font-style: italic; font-size: clamp(1.4rem, 2.4vw, 1.9rem); color: var(--gold); margin-bottom: 1.2rem; }
.hero p.lead { font-size: 1.1rem; color: var(--muted); max-width: 540px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 1.8rem; }
.hero-art { position: relative; display: grid; place-items: center; }
.hero-art img { position: relative; width: min(440px, 100%); mix-blend-mode: multiply; animation: float 7s ease-in-out infinite;
  -webkit-mask-image: radial-gradient(closest-side, #000 90%, transparent 100%); mask-image: radial-gradient(closest-side, #000 90%, transparent 100%); }
.hero-art::before {
  content: ""; position: absolute; width: 78%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 246, 214, .95), rgba(239, 220, 174, 0) 70%);
  filter: blur(8px);
}
.pillars { display: flex; gap: 1.4rem; margin-top: 2.2rem; font-size: .78rem; letter-spacing: .3em; text-transform: uppercase; color: var(--forest); }
.pillars span::before { content: "•"; color: var(--gold); margin-right: 1.4rem; }
.pillars span:first-child::before { display: none; }

@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* ---------- Sections ---------- */
section { padding: clamp(3.5rem, 7vw, 6rem) 0; }
.section-head { text-align: center; max-width: 720px; margin: 0 auto 3rem; }
.section-head p { color: var(--muted); }
.bg-soft { background: var(--cream-2); }
.bg-forest { background: var(--forest); color: var(--cream); }
.bg-forest h2, .bg-forest h3 { color: var(--cream); }
.bg-forest p { color: rgba(252, 249, 242, .8); }

/* Meaning (SOUL + ORA) */
.meaning { display: grid; grid-template-columns: 1fr auto 1fr; gap: 2rem; align-items: stretch; }
.meaning-card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 2.2rem; text-align: center; box-shadow: var(--shadow); }
.meaning-card .word { font-family: var(--font-display); font-size: 3rem; letter-spacing: .12em; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.meaning-plus { display: grid; place-items: center; font-family: var(--font-display); font-size: 2.6rem; color: var(--gold); }
.meaning-result { text-align: center; margin-top: 2.6rem; }
.meaning-result .word { font-family: var(--font-display); font-size: clamp(2.6rem, 6vw, 4.2rem); letter-spacing: .1em; color: var(--forest); }

/* Service cards */
.services-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.4rem; }
.service-card {
  position: relative; display: flex; flex-direction: column;
  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 2rem 1.6rem 1.6rem; box-shadow: var(--shadow); transition: transform .25s ease, box-shadow .25s ease;
  color: var(--ink);
}
.service-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); color: var(--ink); }
.service-icon { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--sage-light); margin-bottom: 1.2rem; }
.service-icon svg { width: 30px; height: 30px; }
.service-card h3 { margin-bottom: .4rem; }
.service-card p { font-size: .96rem; color: var(--muted); flex: 1; }
.service-meta { display: flex; flex-wrap: wrap; gap: .4rem; margin: .4rem 0 1.2rem; }
.chip { display: inline-flex; align-items: center; gap: .35em; padding: .25em .75em; border-radius: 999px; font-size: .74rem; letter-spacing: .04em; background: var(--cream-2); color: var(--green); border: 1px solid var(--cream-3); }
.chip.gold { background: #fbf2dc; color: #8a6a26; border-color: var(--gold-light); }
.chip.warn { background: #f8ebe4; color: var(--danger); border-color: #efd3c6; }
.link-arrow { font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }

/* Steps */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.4rem; counter-reset: step; }
.step { text-align: center; padding: 1rem; }
.step-num { width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 50%; border: 1px solid var(--gold); display: grid; place-items: center; font-family: var(--font-display); font-size: 1.4rem; color: var(--gold); background: var(--white); }
.bg-forest .step-num { background: transparent; }
.step h3 { font-size: 1.2rem; }
.step p { font-size: .95rem; }

/* Page banner */
.page-banner {
  padding: clamp(3rem, 6vw, 4.5rem) 0 clamp(2.5rem, 5vw, 3.5rem);
  text-align: center;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(239, 220, 174, .6), transparent 60%),
    var(--cream);
  border-bottom: 1px solid var(--line);
}
.page-banner p { max-width: 680px; margin: 0 auto; color: var(--muted); font-size: 1.08rem; }
.info-strip { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; margin-top: 1.6rem; }
.info-strip .chip { font-size: .82rem; padding: .45em 1em; }

/* ---------- Practitioner cards ---------- */
.practitioners { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.6rem; align-items: start; }
.p-card {
  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; transition: box-shadow .25s ease, transform .25s ease;
}
.p-card:hover { box-shadow: var(--shadow-lg); }
.p-card.open { box-shadow: var(--shadow-lg); border-color: var(--gold); }
.p-head { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; color: inherit; }
.p-photo { position: relative; aspect-ratio: 4 / 3.4; background: var(--cream-2); overflow: hidden; }
.p-photo img, .p-photo svg { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.p-card:hover .p-photo img, .p-card:hover .p-photo svg { transform: scale(1.03); }
.p-badge { position: absolute; top: 12px; left: 12px; }
.p-badge .chip { background: rgba(255, 253, 248, .92); }
.p-body { padding: 1.2rem 1.4rem 1.3rem; }
.p-name { font-family: var(--font-display); font-size: 1.45rem; color: var(--forest); margin: 0; }
.p-title { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: .6rem; }
.p-row { display: flex; justify-content: space-between; align-items: center; gap: .6rem; font-size: .9rem; color: var(--muted); }
.p-rate { font-family: var(--font-display); font-size: 1.25rem; color: var(--forest); }
.p-rate small { font-family: var(--font-body); font-size: .75rem; color: var(--muted); }
.p-toggle { display: flex; align-items: center; justify-content: center; gap: .5rem; margin-top: 1rem; padding-top: .9rem; border-top: 1px dashed var(--line); font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; color: var(--green); }
.p-toggle .chev { transition: transform .25s ease; }
.p-card.open .p-toggle .chev { transform: rotate(180deg); }

.p-drop { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
.p-card.open .p-drop { grid-template-rows: 1fr; }
.p-drop > div { overflow: hidden; }
.p-drop-inner { padding: 0 1.4rem 1.4rem; }
.drop-links { display: grid; gap: .55rem; margin-bottom: 1.1rem; }
.drop-link {
  display: flex; align-items: center; gap: .8rem; width: 100%; text-align: left;
  padding: .8rem .95rem; border-radius: 12px; border: 1px solid var(--cream-3); background: var(--cream);
  color: var(--forest); transition: all .2s ease;
}
.drop-link:hover { border-color: var(--gold); background: #fffaf0; }
.drop-link .ico { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--sage-light); color: var(--green); }
.drop-link .ico.gold { background: #fbf2dc; color: var(--gold); }
.drop-link strong { display: block; font-weight: 500; font-size: .95rem; }
.drop-link small { color: var(--muted); font-size: .8rem; }
.drop-link[disabled] { opacity: .55; cursor: not-allowed; }
.drop-link[disabled]:hover { border-color: var(--cream-3); background: var(--cream); }

.hours-list { list-style: none; padding: 0; margin: 0 0 1rem; font-size: .88rem; }
.hours-list li { display: flex; justify-content: space-between; padding: .3rem 0; border-bottom: 1px dotted var(--cream-3); }
.hours-list li span:last-child { color: var(--muted); }
.hours-list li.off span:last-child { color: #b5ad9b; font-style: italic; }

.howto { background: var(--cream-2); border-radius: 14px; padding: 1rem 1.1rem; font-size: .88rem; }
.howto h4 { font-family: var(--font-body); font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin: 0 0 .5rem; }
.howto ol { margin: 0 0 .9rem; padding-left: 1.2rem; }
.howto ol:last-child { margin-bottom: 0; }
.howto li { margin-bottom: .25rem; }
.qr-mini { display: flex; gap: .9rem; align-items: center; margin: .2rem 0 .9rem; padding: .7rem; background: var(--white); border-radius: 12px; border: 1px solid var(--cream-3); }
.qr-mini .qr { width: 86px; height: 86px; flex: none; }
.qr-mini p { margin: 0; font-size: .82rem; }

/* Info panel (page-level instructions) */
.guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6rem; }
.guide-card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 2rem; }
.guide-card ol { padding-left: 1.2rem; margin: 0; }
.guide-card li { margin-bottom: .6rem; }
.notice { display: flex; gap: .8rem; padding: 1rem 1.2rem; border-radius: 14px; background: #fbf2dc; border: 1px solid var(--gold-light); font-size: .93rem; color: #6d5420; }
.notice svg { flex: none; width: 22px; height: 22px; margin-top: 2px; }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100; background: rgba(32, 45, 22, .55);
  backdrop-filter: blur(4px); display: grid; place-items: center; padding: 1rem;
  opacity: 0; visibility: hidden; transition: opacity .25s ease;
}
.modal-backdrop.show { opacity: 1; visibility: visible; }
.modal {
  width: min(760px, 100%); max-height: calc(100vh - 2rem); overflow: auto;
  background: var(--cream); border-radius: 22px; border: 1px solid var(--line); box-shadow: var(--shadow-lg);
  transform: translateY(14px); transition: transform .25s ease;
}
.modal-backdrop.show .modal { transform: translateY(0); }
.modal-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 1rem; padding: 1.1rem 1.5rem; background: var(--white); border-bottom: 1px solid var(--line); }
.modal-head .avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex: none; border: 2px solid var(--gold-light); }
.modal-head .avatar img, .modal-head .avatar svg { width: 100%; height: 100%; object-fit: cover; }
.modal-head h3 { margin: 0; font-size: 1.3rem; }
.modal-head small { color: var(--muted); font-size: .82rem; }
.modal-close { margin-left: auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--cream); color: var(--forest); font-size: 1.3rem; line-height: 1; }
.modal-body { padding: 1.5rem; }

.stepper { display: flex; gap: .4rem; margin-bottom: 1.4rem; }
.stepper div { flex: 1; text-align: center; font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-top: .55rem; border-top: 3px solid var(--cream-3); }
.stepper div.on { color: var(--forest); border-top-color: var(--gold); }

.cal-wrap { display: grid; grid-template-columns: 1.15fr 1fr; gap: 1.4rem; }
.calendar { background: var(--white); border: 1px solid var(--cream-3); border-radius: 16px; padding: 1rem; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .6rem; }
.cal-head strong { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; color: var(--forest); }
.cal-nav { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--cream-3); background: var(--cream); color: var(--forest); }
.cal-nav[disabled] { opacity: .35; cursor: not-allowed; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; padding: .3rem 0; }
.cal-day {
  aspect-ratio: 1; border-radius: 10px; border: 1px solid transparent; background: none;
  font-size: .9rem; color: #c3bba8; display: grid; place-items: center; position: relative;
}
.cal-day.avail { color: var(--forest); background: var(--sage-light); border-color: #d5dfc1; }
.cal-day.avail:hover { border-color: var(--gold); }
.cal-day.today::after { content: ""; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
.cal-day.sel { background: var(--forest); color: var(--cream); border-color: var(--forest); }
.cal-day.sel.today::after { background: var(--gold-light); }
.cal-legend { display: flex; gap: 1rem; font-size: .74rem; color: var(--muted); margin-top: .7rem; }
.cal-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: .3rem; vertical-align: middle; }

.slots h4 { font-family: var(--font-body); font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: .7rem; }
.slot-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; }
.slot { padding: .65rem .5rem; border-radius: 10px; border: 1px solid var(--cream-3); background: var(--white); color: var(--forest); font-size: .9rem; }
.slot:hover { border-color: var(--gold); }
.slot.sel { background: var(--forest); color: var(--cream); border-color: var(--forest); }
.slot[disabled] { color: #c3bba8; text-decoration: line-through; background: var(--cream); cursor: not-allowed; }
.empty-note { padding: 1.2rem; border-radius: 12px; background: var(--white); border: 1px dashed var(--cream-3); color: var(--muted); font-size: .9rem; text-align: center; }

.summary { background: var(--white); border: 1px solid var(--cream-3); border-radius: 14px; padding: 1rem 1.2rem; margin-bottom: 1.2rem; font-size: .93rem; }
.summary div { display: flex; justify-content: space-between; gap: 1rem; padding: .25rem 0; }
.summary div span:first-child { color: var(--muted); }
.summary div span:last-child { text-align: right; color: var(--forest); font-weight: 500; }

.modal-foot { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 1.4rem; padding-top: 1.2rem; border-top: 1px solid var(--line); }

/* Forms */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.field { display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
.field input, .field select, .field textarea { width: 100%; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; color: var(--green); }
.field label .req { color: var(--gold); }
.field input, .field select, .field textarea {
  font: inherit; font-size: .98rem; padding: .78rem .95rem; border-radius: 12px;
  border: 1px solid var(--cream-3); background: var(--white); color: var(--ink); transition: border .2s, box-shadow .2s;
}
.field textarea { min-height: 120px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(195, 154, 69, .15); }
.field .hint { font-size: .8rem; color: var(--muted); }
.field.error input, .field.error select, .field.error textarea { border-color: var(--danger); }
.field .err { font-size: .8rem; color: var(--danger); display: none; }
.field.error .err { display: block; }
.check { display: flex; gap: .6rem; align-items: flex-start; font-size: .9rem; color: var(--muted); }
.check input { margin-top: .35rem; accent-color: var(--green); }

/* Payment step */
.pay-grid { display: grid; grid-template-columns: 240px 1fr; gap: 1.4rem; align-items: start; }
.qr-box { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 1rem; text-align: center; }
.qr-box .qr { width: 100%; aspect-ratio: 1; }
.qr-box .acct { font-size: .85rem; margin: .7rem 0 .8rem; color: var(--muted); }
.qr-box .acct strong { display: block; color: var(--forest); font-size: .95rem; }
.amount { font-family: var(--font-display); font-size: 1.9rem; color: var(--forest); }

.upload {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .4rem;
  padding: 1.4rem; border: 1.5px dashed var(--gold); border-radius: 14px; background: #fffaf0; text-align: center; cursor: pointer;
  transition: background .2s;
}
.upload:hover, .upload.drag { background: #fbf2dc; }
.upload input { display: none; }
.field label.upload { text-transform: none; letter-spacing: normal; font-size: .95rem; }
.pay-grid > *, .cal-wrap > * { min-width: 0; }
.upload small { color: var(--muted); }
.upload-preview { display: flex; align-items: center; gap: .8rem; margin-top: .7rem; padding: .6rem; border-radius: 12px; background: var(--white); border: 1px solid var(--cream-3); font-size: .88rem; }
.upload-preview img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
.upload-preview button { margin-left: auto; background: none; border: 0; color: var(--danger); font-size: .8rem; }

.success { text-align: center; padding: 1rem .5rem; }
.success .seal { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 1rem; display: grid; place-items: center; background: var(--gold-grad); color: var(--white); }
.success .ref { display: inline-block; margin: .4rem 0 1.2rem; padding: .5rem 1.1rem; border-radius: 999px; background: var(--white); border: 1px solid var(--gold); font-family: var(--font-display); letter-spacing: .14em; color: var(--forest); }
.success ul { text-align: left; max-width: 460px; margin: 0 auto 1.4rem; padding-left: 1.2rem; color: var(--muted); font-size: .94rem; }

/* ---------- About ---------- */
.about-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 3.5rem; align-items: center; }
.about-logo { background: var(--white); border: 1px solid var(--line); border-radius: 24px; padding: 1.2rem; box-shadow: var(--shadow); }
.about-logo img { mix-blend-mode: multiply; }
.values { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4rem; }

  /* Sample QR (used until a real payment QR image is added in data.js) */
  function sampleQR(seedStr) {
    const N = 25, cell = 8, size = N * cell;
    let seed = hash(seedStr);
    const rnd = () => ((seed = Math.imul(seed ^ (seed >>> 15), 2246822507) ^ Math.imul(seed ^ (seed >>> 13), 3266489909)) >>> 0) / 4294967296;
    const finder = (x, y) => `<rect x="${x * cell}" y="${y * cell}" width="${7 * cell}" height="${7 * cell}" fill="#2b3f1d"/><rect x="${(x + 1) * cell}" y="${(y + 1) * cell}" width="${5 * cell}" height="${5 * cell}" fill="#fff"/><rect x="${(x + 2) * cell}" y="${(y + 2) * cell}" width="${3 * cell}" height="${3 * cell}" fill="#2b3f1d"/>`;
    const inFinder = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
    const inCenter = (x, y) => x > 8 && x < 16 && y > 10 && y < 14;
    let cells = "";
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      if (inFinder(x, y) || inCenter(x, y)) continue;
      if (rnd() > 0.52) cells += `<rect x="${x * cell}" y="${y * cell}" width="${cell}" height="${cell}"/>`;

    return `<svg class="qr" viewBox="-8 -8 ${size + 16} ${size + 16}" xmlns="http://www.w3.org/2000/svg"><rect x="-8" y="-8" width="${size + 16}" height="${size + 16}" fill="#fff" rx="8"/><g fill="#2b3f1d">${cells}</g>${finder(0, 0)}${finder(N - 7, 0)}${finder(0, N - 7)}<rect x="${9 * cell}" y="${11 * cell}" width="${7 * cell}" height="${3 * cell}" rx="4" fill="#c39a45"/><text x="${12.5 * cell}" y="${12.9 * cell}" text-anchor="middle" font-family="Jost,sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#fff">SAMPLE</text></svg>`;

  function slotsFor(svc, p, date) {
    const hrs = p.hours[date.getDay()];
    if (!hrs) return [];

    const now = new Date();
    const isToday = ymd(date) === ymd(now);
    const nowMin = now.getHours() * 60 + now.getMinutes() + 60; // need at least 1 hour notice
    const out = [];
    const step = p.duration <= 45 ? 60 : Math.ceil((p.duration + 15) / 30) * 30; // includes rest/buffer time
    for (let t = s; t + p.duration <= e; t += step) {
      const taken = hash(`${p.id}|${ymd(date)}|${t}`) % 4 === 0; // demo: some slots pre-taken
      const past = isToday && t < nowMin;
      if (!past) out.push({ t, taken });
    }
    return out;
  }

    const today = startOfDay(new Date());

    const lead = svc.minLeadDays || 0;
    if (diff < lead || diff > BOOK_AHEAD_DAYS) return false;
    return slotsFor(svc, p, d).some((s) => !s.taken);

  function practitionerCard(svc, p) {
    const sd = sameDayAllowed(svc, p);
    const todayOpen = sd && isBookableDay(svc, p, new Date(), "today");
    const hours = [1, 2, 3, 4, 5, 6, 0].map((d) => {
      const h = p.hours[d];
      return `<li class="${h ? "" : "off"}"><span>${DAYS[d]}</span><span>${h ? `${fmtTime(toMin(h[0]))} – ${fmtTime(toMin(h[1]))}` : "Unavailable"}</span></li>`;
    }).join("");
    let sameDayLabel = "Same-day consultation slots";
    if (svc.id !== "mentorship") sameDayLabel = "Same-day appointment slots";
    let sameDaySub = todayOpen ? "Open slots available today" : "No open slots left today";
    if (!sd) sameDaySub = svc.noSameDay ? "Not available: book at least 1 day ahead" : "This practitioner doesn't take same-day bookings";

    return `
    <article class="p-card" data-svc="${svc.id}" data-pid="${p.id}">
      <button class="p-head" type="button" aria-expanded="false">
        <div class="p-photo">${portrait(p)}<div class="p-badge"><span class="chip ${sd && todayOpen ? "" : "gold"}">${sd && todayOpen ? "● Available today" : esc(p.mode)}</span></div></div>
        <div class="p-body">
          <h3 class="p-name">${esc(p.name)}</h3>
          <div class="p-title">${esc(p.title)}</div>
          <div class="p-row"><span class="p-rate">${rateText(p)} <small>/ ${durText(p)}</small></span><span>${esc(p.mode)}</span></div>
          <div class="p-toggle">View booking options ${ICON.chev}</div>
        </div>
      </button>
      <div class="p-drop"><div><div class="p-drop-inner">
        <p style="font-size:.92rem;color:var(--muted);margin-bottom:1rem">${esc(p.bio)}${p.location ? ` <br><strong style="color:var(--forest);font-weight:500">Location:</strong> ${esc(p.location)}` : ""}</p>
        <div class="drop-links">
          <button class="drop-link" data-action="book" type="button"><span class="ico">${ICON.cal}</span><span><strong>Set an appointment</strong><small>Open ${esc(p.name.split(" ").pop())}'s calendar</small></span></button>
          <button class="drop-link" data-action="today" type="button" ${sd && todayOpen ? "" : "disabled"}><span class="ico gold">${ICON.today}</span><span><strong>${sameDayLabel}</strong><small>${sameDaySub}</small></span></button>
        </div>
        <details style="margin-bottom:1rem"><summary style="cursor:pointer;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--green)">Weekly hours</summary><ul class="hours-list" style="margin-top:.6rem">${hours}</ul></details>
        <div class="howto">
          <h4>How to book</h4>
          <ol>
            <li>Tap <strong>Set an appointment</strong> (or a same-day slot).</li>
            <li>Choose your date and time, then enter your details.</li>
          </ol>
          <h4>How to pay</h4>
          <div class="qr-mini">${qrMarkup(p)}<p><strong>${esc(p.payment.method)}</strong><br>${esc(p.payment.accountName)}<br>Amount: <strong>${rateText(p)}</strong></p></div>
          <ol>
            <li>Scan or save this QR code and pay online.</li>
            <li>Upload your proof of payment (screenshot) in the booking form.</li>
            <li>We'll email you within ${CFG.verifyHours} hrs to confirm your payment and whether your appointment will push through.</li>
          </ol>
        </div>
      </div></div></div>
    </article>`;
  }

  function pageService(id) {
    const svc = SERVICES[id];
    const extra = id === "quantum"
      ? `<div class="notice" style="margin-bottom:2rem">${ICON.info}<div><strong>In-person only. No same-day appointments.</strong> Quantum Healing sessions take 45 minutes to 1 hour, depending on the depth of the healing. Please book at least one day ahead and arrive 10 minutes early.</div></div>`
      : id === "mentorship"
      ? `<div class="notice" style="margin-bottom:2rem">${ICON.info}<div><strong>For practitioners.</strong> Use <em>same-day consultation</em> when you need guidance today (for example, after a challenging session). For mentoring, case reviews or practice planning, choose <em>Set an appointment</em> and pick any open date.</div></div>`
      : id === "tarot"
      ? `<div class="notice" style="margin-bottom:2rem">${ICON.info}<div><strong>General Reading · 1 hour · ₱1,000 – ₱1,500.</strong> The rate depends on the reader you choose. Prepare up to 3 questions, or come open to whatever guidance the cards offer.</div></div>`
      : "";
    return `
    <section class="page-banner">
      <div class="container">
        <div class="service-icon" style="margin:0 auto 1rem;width:68px;height:68px">${SERVICE_ICONS[id]}</div>
        <span class="eyebrow">Soulora Services</span>
        <h1>${esc(svc.name)}</h1>
        <p>${esc(svc.intro)}</p>
        <div class="info-strip">${svc.chips.map((c, i) => `<span class="chip ${i === 0 ? "gold" : ""}">${esc(c)}</span>`).join("")}</div>
      </div>
    </section>
    <nav class="svc-switch" aria-label="Switch service"><div class="container">${Object.values(SERVICES).map((s) => `<a href="#${s.id}" class="${s.id === id ? "on" : ""}">${esc(s.name)}</a>`).join("")}</div></nav>
    <section class="svc-section">
      <div class="container">
        ${extra}
        <p class="tap-hint">Tap a ${id === "tarot" ? "reader" : id === "mentorship" ? "mentor" : id === "quantum" ? "practitioner" : "healer"} to see their calendar, same-day slots and how to pay.</p>
        <div class="practitioners">${svc.practitioners.map((p) => practitionerCard(svc, p)).join("")}</div>
      </div>
    </section>
    <section class="bg-soft">
      <div class="container">
        <div class="section-head"><span class="eyebrow">Booking guide</span><h2>How to book &amp; how to pay</h2>${divider}</div>
        <div class="guide-grid">
          <div class="guide-card">
            <h3>How to book</h3>
            <ol>
              <li>Tap a ${id === "tarot" ? "reader" : id === "mentorship" ? "mentor" : "healer"}'s card to open their booking options.</li>
              <li>Choose <strong>Set an appointment</strong> to see their calendar${svc.noSameDay ? "" : ", or <strong>Same-day slots</strong> if you'd like a session today"}.</li>
              <li>Pick an open date and time (shown in ${esc(CFG.timezoneLabel)}).</li>
              <li>Fill in your name, email, mobile number and your intention for the session.</li>
            </ol>
          </div>
          <div class="guide-card">
            <h3>How to pay</h3>
            <ol>
              <li>Scan the practitioner's QR code with GCash, Maya or your banking app, or save the QR image and upload it in your app.</li>
              <li>Pay the exact amount shown, then take a screenshot of your receipt.</li>
              <li>Upload the screenshot as your <strong>proof of payment</strong> and submit your booking.</li>
              <li>We'll verify your payment and email you within ${CFG.verifyHours} hours to tell you whether it's confirmed and your appointment will push through.</li>
            </ol>
          </div>
        </div>
      </div>
    </section>`;
  }

  /* ---------- Feedback wall (shared with every visitor via /api/feedback) ---------- */
  let FB_CACHE = null;
  const fmtFbDate = (ts) => { const d = new Date(ts); return isNaN(d) ? "" : `${MONTHS[d.getMonth()].slice(0, 3)} ${d.getDate()}, ${d.getFullYear()}`; };
  function fbCard(f) {
    const r = Math.max(1, Math.min(5, Number(f.rating) || 5));
    return `<article class="fb-card">
      <div class="fb-top"><strong class="fb-name">${esc(f.name || "Anonymous")}</strong><span class="fb-stars" aria-label="${r} out of 5 stars">${"★".repeat(r)}${"☆".repeat(5 - r)}</span></div>
      <p class="fb-text">${esc(f.comment)}</p>
      <footer>${esc(f.service || "")}${f.at ? ` · ${fmtFbDate(f.at)}` : ""}</footer>
    </article>`;
  }
  function drawWall(items) {
    const wall = $("#feedback-wall"); if (!wall) return;
    wall.innerHTML = items.length
      ? items.map(fbCard).join("")
      : `<div class="empty-note" style="grid-column:1/-1">No feedback yet. Be the first to share your experience.</div>`;
  }
  async function renderFeedbackWall() {
    const wall = $("#feedback-wall"); if (!wall) return;
    if (FB_CACHE) drawWall(FB_CACHE); else wall.innerHTML = `<div class="empty-note" style="grid-column:1/-1">Loading feedback…</div>`;
    try {
      const res = await fetch(CFG.feedbackApi, { headers: { Accept: "application/json" }, cache: "no-store" });
      if (!res.ok) throw new Error();
      const data = await res.json();
      FB_CACHE = Array.isArray(data.items) ? data.items : [];
    } catch {
      FB_CACHE = FB_CACHE || store.get("soulora_feedback_local", []); // offline / not set up yet
    }
    drawWall(FB_CACHE);
  }

    if ($("#modal").classList.contains("show")) closeBooking();
    setMenu(false);
    $$(".has-sub.open").forEach((x) => x.classList.remove("open"));
    let key = (location.hash || "#home").slice(1) || "home";
    const isSvc = !!SERVICES[key];
    const view = isSvc ? pageService(key) : (ROUTES[key] || pageHome)();
    app.innerHTML = `<div class="view">${view}</div>`;
    $$("[data-nav]").forEach((a) => a.classList.toggle("active", a.dataset.nav === key));
    const tabKey = isSvc ? "services" : ROUTES[key] ? key : "home";
    $$("[data-tab]").forEach((a) => a.classList.toggle("active", a.dataset.tab === tabKey));
    document.title = (isSvc ? SERVICES[key].name : key === "home" || !ROUTES[key] ? "Where the soul finds its light" : $("h1", app).textContent) + " · Soulora";
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    if (key === "feedback") renderFeedbackWall();
    if (key === "join") activateEmbeds();
    const on = $(".svc-switch a.on");
    if (on) { const c = on.parentElement; c.scrollLeft = on.offsetLeft - (c.clientWidth - on.offsetWidth) / 2; }
  }

  /* ==========================================================================
     BOOKING MODAL
     ========================================================================== */
  const B = { svc: null, p: null, mode: "schedule", step: 1, date: null, time: null, month: null, details: {}, ref: null };

  function openBooking(svcId, pid, mode) {
    const { svc, p } = findPractitioner(svcId, pid);
    if (!p) return;
    Object.assign(B, { svc, p, mode, step: 1, date: null, time: null, details: {}, ref: null });
    const today = startOfDay(new Date());
    B.month = new Date(today.getFullYear(), today.getMonth(), 1);
    if (mode === "today") B.date = today;
    else {
      // jump to first bookable day
      for (let i = 0; i <= BOOK_AHEAD_DAYS; i++) {
        const d = new Date(today); d.setDate(d.getDate() + i);
        if (isBookableDay(svc, p, d, "schedule")) { B.date = d; B.month = new Date(d.getFullYear(), d.getMonth(), 1); break; }
      }
    }
    const m = $("#modal");
    $(".modal-head", m).innerHTML = `
      <div class="avatar">${portrait(p)}</div>
      <div><h3>${esc(p.name)}</h3><small>${esc(svc.name)} · ${rateText(p)} · ${durText(p)} · ${esc(p.mode)}</small></div>
      <button class="modal-close" type="button" aria-label="Close">×</button>`;
    renderStep();
    m.classList.add("show");
    document.body.style.overflow = "hidden";
  }
  function closeBooking() {
    $("#modal").classList.remove("show");
    document.body.style.overflow = "";
  }

  function stepper() {
    const labels = ["Schedule", "Payment", "Form", "Done"];
    return `<div class="stepper">${labels.map((l, i) => `<div class="${i < B.step ? "on" : ""}">${i + 1}. ${l}</div>`).join("")}</div>`;
  }

  function calendarHTML() {
    const { svc, p } = B;
    const y = B.month.getFullYear(), mo = B.month.getMonth();
    const first = new Date(y, mo, 1);
    const daysIn = new Date(y, mo + 1, 0).getDate();
    const today = startOfDay(new Date());
    const maxMonth = new Date(today.getFullYear(), today.getMonth() + 2, 1);
    let cells = DOW.map((d) => `<div class="cal-dow">${d}</div>`).join("");
    for (let i = 0; i < first.getDay(); i++) cells += `<div></div>`;
    for (let d = 1; d <= daysIn; d++) {
      const date = new Date(y, mo, d);
      const ok = isBookableDay(svc, p, date, B.mode);
      const cls = ["cal-day", ok ? "avail" : "", ymd(date) === ymd(today) ? "today" : "", B.date && ymd(date) === ymd(B.date) ? "sel" : ""].join(" ");
      cells += `<button type="button" class="${cls}" ${ok ? `data-date="${ymd(date)}"` : "disabled"} aria-label="${fmtDate(date)}${ok ? "" : " (unavailable)"}">${d}</button>`;
    }
    const prevDisabled = B.mode === "today" || B.month <= new Date(today.getFullYear(), today.getMonth(), 1);
    const nextDisabled = B.mode === "today" || B.month >= maxMonth;
    return `
      <div class="calendar">
        <div class="cal-head">
          <button class="cal-nav" type="button" data-cal="-1" ${prevDisabled ? "disabled" : ""} aria-label="Previous month">‹</button>
          <strong>${MONTHS[mo]} ${y}</strong>
          <button class="cal-nav" type="button" data-cal="1" ${nextDisabled ? "disabled" : ""} aria-label="Next month">›</button>
        </div>
        <div class="cal-grid">${cells}</div>
        <div class="cal-legend"><span><i style="background:var(--sage-light);border:1px solid #d5dfc1"></i>Available</span><span><i style="background:var(--forest)"></i>Selected</span><span><i style="background:var(--gold);border-radius:50%;width:6px;height:6px"></i>Today</span></div>
      </div>`;
  }

  function slotsHTML() {
    if (!B.date) return `<div class="empty-note">${B.mode === "today" ? "No open slots left today. Please choose <strong>Set an appointment</strong> to pick another day." : "No open dates in the next 60 days. Please contact us."}</div>`;
    const slots = slotsFor(B.svc, B.p, B.date);
    return `
      <div class="slots">
        <h4>${B.mode === "today" ? "Today · " : ""}${fmtDate(B.date)}</h4>
        ${slots.length ? `<div class="slot-grid">${slots.map((s) => `<button type="button" class="slot ${B.time === s.t ? "sel" : ""}" data-time="${s.t}" ${s.taken ? "disabled title='Already booked'" : ""}>${fmtTime(s.t)}</button>`).join("")}</div>` : `<div class="empty-note">No open times on this day.</div>`}
        <p style="font-size:.8rem;color:var(--muted);margin-top:.8rem">Times are in ${esc(CFG.timezoneLabel)}. Session length: ${durText(B.p)}.</p>
      </div>`;
  }

  function summaryHTML() {
    const { svc, p } = B;
    return `<div class="summary">
      <div><span>Service</span><span>${esc(svc.name)}${svc.id === "tarot" ? " · General Reading" : ""}</span></div>
      <div><span>Practitioner</span><span>${esc(p.name)}</span></div>
      <div><span>Date</span><span>${B.date ? fmtDate(B.date) : "-"}</span></div>
      <div><span>Time</span><span>${B.time != null ? `${fmtTime(B.time)} (${durText(p)})` : "-"}</span></div>
      <div><span>Session</span><span>${esc(p.mode)}${p.location ? ` · ${esc(p.location)}` : ""}</span></div>
      ${B.ref ? `<div><span>Reference</span><span>${esc(B.ref)}</span></div>` : ""}
      <div><span>Amount due</span><span>${rateText(p)}</span></div>
    </div>`;
  }

  function renderStep() {
    const body = $("#modal .modal-body");
    const { svc, p } = B;
    let html = stepper();

    if (B.step === 1) {
      html += `
        ${B.mode === "today" ? `<div class="notice" style="margin-bottom:1rem">${ICON.info}<div><strong>Same-day ${svc.id === "mentorship" ? "consultation" : "booking"}.</strong> Only today's remaining open times are shown. Pay right after booking so we can verify in time.</div></div>` : ""}
        ${svc.noSameDay ? `<div class="notice" style="margin-bottom:1rem">${ICON.info}<div>In-person only · no same-day appointments. The earliest date you can book is tomorrow.</div></div>` : ""}
        <div class="cal-wrap">${calendarHTML()}${slotsHTML()}</div>
        <div class="modal-foot"><button class="btn btn-ghost btn-sm" type="button" data-close>Cancel</button><button class="btn btn-primary" type="button" data-next ${B.time == null ? "disabled" : ""}>Continue</button></div>`;
    }

    if (B.step === 2) {
      html += `
        <div class="pay-grid">
          <div class="qr-box">
            ${qrMarkup(p)}
            <div class="acct"><strong>${esc(p.payment.method)}</strong>${esc(p.payment.accountName)}</div>
            <div class="amount">${rateText(p)}</div>
            <button class="btn btn-ghost btn-sm" type="button" data-saveqr style="margin-top:.8rem;width:100%">Save QR Code</button>
          </div>
          <div>
            <h3 style="margin-bottom:.6rem">Pay for your session</h3>
            <ol style="padding-left:1.2rem;font-size:.95rem;margin-top:0">
              <li>Open GCash, Maya or your banking app and <strong>scan the QR code</strong>, or tap <em>Save QR Code</em> and upload it in your app.</li>
              <li>Pay exactly <strong>${rateText(p)}</strong>.</li>
              <li><strong>Take a screenshot of your receipt.</strong> You'll upload it in the booking form on the next step.</li>
            </ol>
            ${summaryHTML()}
          </div>
        </div>
        <div class="modal-foot"><button class="btn btn-ghost btn-sm" type="button" data-back>Back</button><button class="btn btn-primary" type="button" data-next>I've paid · Continue</button></div>`;
    }

    if (B.step === 3) {
      if (!B.ref) B.ref = "SLR-" + Date.now().toString(36).toUpperCase().slice(-6);
      html += `
        <div class="notice" style="margin-bottom:1rem">${ICON.info}<div><strong>Last step: fill in the booking form below.</strong> Enter your details, paste your booking details (tap <em>Copy booking details</em>), and <strong>upload the screenshot of your payment</strong>. Then tap the form's submit button.</div></div>
        <div class="booking-copy">
          ${summaryHTML()}
          <button class="btn btn-ghost btn-sm" type="button" data-copydetails>Copy booking details</button>
        </div>
        ${formEmbed(CFG.bookingFormUrl, "Soulora booking form")}
        <div class="modal-foot"><button class="btn btn-ghost btn-sm" type="button" data-back>Back</button><button class="btn btn-gold" type="button" data-next>I've submitted the form</button></div>`;
    }

    if (B.step === 4) {
      store.set("soulora_last_booking", { ref: B.ref, service: svc.name, practitioner: p.name, date: ymd(B.date), time: fmtTime(B.time) });
      html += `
        <div class="success">
          <div class="seal">${ICON.check}</div>
          <h2 style="font-size:2rem">Thank you</h2>
          <p style="color:var(--muted)">Your booking request has been sent to Soulora.</p>
          <div class="ref">REF: ${esc(B.ref)}</div>
          ${summaryHTML()}
          <ul>
            <li>Status: <strong style="color:var(--gold)">Pending payment verification</strong></li>
            <li>We'll check your payment and email you within ${CFG.verifyHours} hours to tell you whether it's confirmed and your appointment will push through.</li>
            <li>Questions? Email us at <strong>${esc(CFG.email)}</strong> and include your reference number.</li>
          </ul>
          <button class="btn btn-primary" type="button" data-close>Done</button>
        </div>`;
    }

    body.innerHTML = html;
    body.scrollTop = 0;
    $("#modal .modal").scrollTop = 0;
    if (B.step === 3) activateEmbeds();
  }

  function validate(form) {
    let ok = true;
    $$("[required]", form).forEach((el) => {
      const f = el.closest(".field");
      let good = el.type === "checkbox" ? el.checked : el.value.trim() !== "";
      if (good && el.type === "email") good = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.value.trim());
      if (f) f.classList.toggle("error", !good);
      if (!good) ok = false;
    });
    $$("input[type=email]:not([required])", form).forEach((el) => {
      const good = !el.value.trim() || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.value.trim());
      el.closest(".field").classList.toggle("error", !good);
      if (!good) ok = false;
    });
    return ok;
  }

  function saveQR() {
    const p = B.p;
    try {
      const a = document.createElement("a");
      if (p.payment.qr) { a.href = p.payment.qr; a.download = `soulora-${p.id}-qr`; }
      else {
        const blob = new Blob([sampleQR(p.id).replace('class="qr"', 'width="600" height="600"')], { type: "image/svg+xml" });
        a.href = URL.createObjectURL(blob); a.download = `soulora-${p.id}-qr.svg`;
      }
      document.body.appendChild(a); a.click(); a.remove();
      toast("QR code saved. Open it in your payment app to pay.");
    } catch { toast("Long-press the QR image to save it to your phone."); }
  }

  function bookingText() {
    const { svc, p } = B;
    return [
      `Booking reference: ${B.ref}`,
      `Service: ${svc.name}${svc.id === "tarot" ? " (General Reading)" : ""}`,
      `Practitioner: ${p.name}`,
      `Date: ${fmtDate(B.date)}`,
      `Time: ${fmtTime(B.time)} (${durText(p)}, ${CFG.timezoneLabel})`,
      `Type: ${B.mode === "today" ? "Same-day" : "Scheduled"} · ${p.mode}${p.location ? " · " + p.location : ""}`,
      `Amount paid: ${rateText(p)} via ${p.payment.method}`
    ].join("\n");
  }
  async function copyDetails() {
    const text = bookingText();
    try { await navigator.clipboard.writeText(text); toast("Booking details copied. Paste them into the form."); }
    catch {
      const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Booking details copied. Paste them into the form."); } catch { toast("Please type your booking details into the form."); }
      ta.remove();
    }
  }

  /* ==========================================================================
     GLOBAL EVENTS
     ========================================================================== */
  document.addEventListener("click", (e) => {
    const t = e.target;

    // smooth scroll links within home
    const sc = t.closest("[data-scroll]");
    if (sc) {
      e.preventDefault();
      const go = () => { const el = document.getElementById(sc.dataset.scroll); if (el) el.scrollIntoView({ behavior: "smooth" }); };
      if ((location.hash || "#home") !== "#home") { location.hash = "home"; setTimeout(go, 80); } else go();
      return;
    }

    // practitioner card toggle
    const head = t.closest(".p-head");
    if (head) {
      const card = head.closest(".p-card");
      const open = !card.classList.contains("open");
      $$(".p-card.open").forEach((c) => { if (c !== card) { c.classList.remove("open"); $(".p-head", c).setAttribute("aria-expanded", "false"); } });
      card.classList.toggle("open", open); head.setAttribute("aria-expanded", open);
      return;
    }
    const act = t.closest(".drop-link[data-action]");
    if (act && !act.disabled) {
      const card = act.closest(".p-card");
      openBooking(card.dataset.svc, card.dataset.pid, act.dataset.action === "today" ? "today" : "schedule");
      return;
    }

    // modal
    if (!t.closest("#modal")) return;
    if (t.matches(".modal-backdrop") || t.closest(".modal-close") || t.closest("[data-close]")) { closeBooking(); return; }
    const day = t.closest(".cal-day[data-date]");
    if (day) { const [y, m, d] = day.dataset.date.split("-").map(Number); B.date = new Date(y, m - 1, d); B.time = null; renderStep(); return; }
    const nav = t.closest("[data-cal]");
    if (nav && !nav.disabled) { B.month = new Date(B.month.getFullYear(), B.month.getMonth() + Number(nav.dataset.cal), 1); renderStep(); return; }
    const slot = t.closest(".slot[data-time]");
    if (slot && !slot.disabled) { B.time = Number(slot.dataset.time); renderStep(); return; }
    if (t.closest("[data-back]")) { B.step--; renderStep(); return; }
    if (t.closest("[data-next]")) { B.step++; renderStep(); return; }
    if (t.closest("[data-copydetails]")) { copyDetails(); return; }
    if (t.closest("[data-saveqr]")) { saveQR(); return; }
  });

  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#modal").classList.contains("show")) closeBooking(); });

  // Contact & feedback forms
  document.addEventListener("submit", async (e) => {
    const form = e.target;
    if (form.id !== "contact-form" && form.id !== "feedback-form") return;
    e.preventDefault();
    let ok = validate(form);
    if (form.id === "feedback-form") {
      const r = form.querySelector("[name=rating]:checked");
      const rf = form.querySelector(".stars").closest(".field");
      rf.classList.toggle("error", !r); if (!r) ok = false;
    }
    if (!ok) { toast("Please complete the required fields."); return; }
    const data = Object.fromEntries(new FormData(form).entries());
    const isFb = form.id === "feedback-form";
    if (isFb) { postFeedback(form, data); return; }
    const subject = `Soulora inquiry: ${data.topic}`;
    const body = `Name: ${data.name}\nEmail: ${data.email}\nMobile: ${data.phone || "-"}\nTopic: ${data.topic}\n\n${data.message}`;
    const mailto = `mailto:${CFG.inquiryEmail || CFG.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    const okBox = $("#contact-ok");
    okBox.innerHTML = `Your email app should open with your message ready. Just tap <strong>Send</strong>. If it didn't open, email us at <strong>${esc(CFG.email)}</strong>.`;
    okBox.classList.add("show");
    okBox.scrollIntoView({ behavior: "smooth", block: "center" });
    window.location.href = mailto;
    form.reset();
  });

  /* ---------- Feedback: name choice + posting ---------- */
  document.addEventListener("change", (e) => {
    if (e.target.name !== "nameMode") return;
    const form = e.target.form, mode = e.target.value;
    $$("[data-namefield]", form).forEach((f) => {
      const on = f.dataset.namefield === mode;
      f.hidden = !on; f.classList.remove("error");
      const inp = $("input", f); inp.required = on;
    });
  });

  async function postFeedback(form, data) {
    const displayName = (data.nameMode === "alias" ? data.alias : data.realName || "").trim().slice(0, 40);
    const entry = { name: displayName, rating: Number(data.rating), service: data.service, practitioner: (data.practitioner || "").trim(), comment: data.comment.trim(), website: data.website || "" };
    const btn = $("button[type=submit]", form); btn.disabled = true; btn.textContent = "Posting…";
    const okBox = $("#fb-ok");
    let posted = null, shared = true;
    try {
      const res = await fetch(CFG.feedbackApi, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(entry) });
      const out = await res.json().catch(() => ({}));
      if (res.status === 429 || res.status === 400) { toast(out.error || "Please check your feedback and try again."); btn.disabled = false; btn.textContent = "Post Feedback"; return; }
      if (!res.ok) throw new Error();
      posted = out.item;
    } catch {
      shared = false; // service not reachable / not set up yet: keep it in this browser so it still shows
      posted = { name: entry.name, rating: entry.rating, service: entry.service, comment: entry.comment, at: Date.now() };
      const local = store.get("soulora_feedback_local", []); local.unshift(posted); store.set("soulora_feedback_local", local.slice(0, 50));
    }
    FB_CACHE = [posted, ...(FB_CACHE || []).filter((x) => x.id !== posted.id)];
    drawWall(FB_CACHE);
    btn.disabled = false; btn.textContent = "Post Feedback";
    form.reset();
    form.dispatchEvent(new Event("reset"));
    $$("[data-namefield]", form).forEach((f) => { const on = f.dataset.namefield === "real"; f.hidden = !on; $("input", f).required = on; });
    okBox.innerHTML = shared ? `Thank you, ${esc(posted.name)}. Your feedback is now on this page.` : `Thank you. Your feedback was saved, but we couldn't reach our server just now, so only you can see it for the moment.`;
    okBox.classList.add("show");
    const card = $("#feedback-wall .fb-card"); (card || okBox).scrollIntoView({ behavior: "smooth", block: "center" });
    if (card) card.classList.add("fb-new");
    if (CFG.feedbackEmailCopy) {
      const subject = `Soulora feedback (${entry.rating}★): ${entry.service}`;
      const body = `Shown as: ${entry.name}\nReal name or alias: ${data.nameMode === "alias" ? "Alias" : "Real name"}\nEmail: ${data.email || "-"}\nService: ${entry.service}\nPractitioner: ${entry.practitioner || "-"}\nRating: ${entry.rating} / 5\n\n${entry.comment}`;
      setTimeout(() => { window.location.href = `mailto:${CFG.inquiryEmail || CFG.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`; }, 1500);
    }
  }

  /* ---------------- init ---------------- */
  renderChrome();
  window.addEventListener("hashchange", route);
  route();
})();

</script>
  <script>
    /* Safety check: if a site file is missing, say so instead of showing a blank page */
    window.addEventListener("load", function () {
      var missing = [];
      if (!window.SOULORA_SERVICES) missing.push("data.js");
      if (!document.getElementById("site-header").innerHTML.trim()) missing.push("app.js");
      if (!missing.length) return;
      document.getElementById("app").innerHTML =
        '<div style="max-width:640px;margin:4rem auto;padding:2rem;font-family:Arial,sans-serif;background:#fff8e8;border:1px solid #d9b765;border-radius:14px;color:#2b3f1d">' +
        '<h2 style="margin-top:0">Soulora is being updated</h2>' +
        '<p>This website could not load: <strong>' + missing.join(" and ") + '</strong>.</p>' +
        '<p style="font-size:14px;color:#6c7461">Site owner: make sure ' + missing.join(" and ") + ' is uploaded to the main (top) level of the GitHub repository, next to index.html, with exactly that name.</p></div>';
    });
  </script>
</body>
</html>
